<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Habit Stacker</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#24625E">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Habit Stacker">
<style>
:root{--bg:#F2F4F1;--surface:#FFFFFF;--ink:#1E2A32;--muted:#5C6870;--line:#D6DCD8;--home:#46698C;--body:#3F8050;--word:#774A8A;--hobby:#9E7216;--accent:#24625E;--onaccent:#FFFFFF;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#131A1E;--surface:#1C262C;--ink:#E7ECEA;--muted:#9AA7AD;--line:#2F3C43;--home:#7FA6CC;--body:#74BB86;--word:#B88FCB;--hobby:#D9A94A;--accent:#6FC2BA;--onaccent:#0E1517}}
:root[data-theme="dark"]{--bg:#131A1E;--surface:#1C262C;--ink:#E7ECEA;--muted:#9AA7AD;--line:#2F3C43;--home:#7FA6CC;--body:#74BB86;--word:#B88FCB;--hobby:#D9A94A;--accent:#6FC2BA;--onaccent:#0E1517}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:560px;margin:0 auto;padding:20px 16px 48px}
h1{font:600 28px/1.15 Georgia,"Times New Roman",serif;margin:8px 0 6px;letter-spacing:-.01em}
.sub{color:var(--muted);margin:0 0 18px;max-width:46ch}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:18px}
.tab{flex:1;background:none;border:0;border-bottom:3px solid transparent;padding:10px 4px;font:600 16px inherit;font-family:inherit;color:var(--muted);cursor:pointer}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:14px}
.seg button{border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:10px 4px;font:600 14px inherit;font-family:inherit;cursor:pointer}
.seg button[aria-pressed="true"]{border-color:var(--c);box-shadow:inset 0 -4px 0 var(--c)}
.why{margin:0 0 16px;padding-left:12px;border-left:4px solid var(--c);color:var(--muted);max-width:48ch}
label{display:block;font-weight:600;margin:16px 0 6px}
select,input[type=text],input[type=time]{width:100%;padding:11px 12px;font:16px inherit;font-family:inherit;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.chip{border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:8px 13px;font:14px inherit;font-family:inherit;cursor:pointer;text-align:left}
.chip[aria-pressed="true"]{border-color:var(--c);background:var(--c);color:var(--bg)}
.prev{margin:20px 0 6px;padding:14px;border-radius:12px;background:var(--surface);border:1.5px dashed var(--c);font:italic 18px/1.4 Georgia,serif;min-height:60px}
.prev.empty{color:var(--muted);font-size:15px}
.msg{min-height:22px;color:var(--muted);font-size:14px;margin:4px 0 8px}
.add{width:100%;padding:14px;border:0;border-radius:12px;background:var(--accent);color:var(--onaccent);font:700 16px inherit;font-family:inherit;cursor:pointer}
.group{margin:0 0 22px}
.group h2{font:600 18px Georgia,serif;margin:0 0 8px;color:var(--c)}
.row{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--c);border-radius:10px;padding:12px;margin-bottom:8px}
.chk{flex:none;width:34px;height:34px;border-radius:50%;border:2px solid var(--c);background:none;color:var(--bg);cursor:pointer;font-size:18px;line-height:1;padding:0}
.chk[aria-pressed="true"]{background:var(--c)}
.rt{flex:1;min-width:0}
.rt p{margin:0 0 6px}
.meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.dots{display:flex;gap:4px}
.dot{width:10px;height:10px;border-radius:50%;border:1.5px solid var(--line)}
.dot.on{background:var(--c);border-color:var(--c)}
.del{background:none;border:0;color:var(--muted);font:13px inherit;font-family:inherit;text-decoration:underline;cursor:pointer;padding:4px;margin-left:auto}
.prog{font-weight:600;margin:0 0 16px}
.note{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;font-size:14px;color:var(--muted);margin-bottom:16px}
.empty-state{text-align:center;padding:36px 12px;color:var(--muted)}
.empty-state button{margin-top:12px;padding:10px 18px;border:0;border-radius:10px;background:var(--accent);color:var(--onaccent);font:600 15px inherit;font-family:inherit;cursor:pointer}
@media (prefers-reduced-motion:no-preference){.chk,.chip,.seg button{transition:background .15s,border-color .15s}}
</style>
</head>
<body>
<main>
<h1>Habit Stacker</h1>
<p class="sub">Attach one small habit to something you already do every day. Start tiny, keep it steady.</p>
<div class="tabs" role="tablist">
<button class="tab" role="tab" data-act="tab" data-v="build" id="t-build">Build a stack</button>
<button class="tab" role="tab" data-act="tab" data-v="today" id="t-today">Today</button>
</div>
<div id="view"></div>
</main>
<script>
var CATS={
home:{name:"Home",c:"--home",why:"A tidy home is built in small resets, not big cleaning days.",habits:["put away five things that don’t belong","make the bed","wipe down the kitchen counter","start or fold one load of laundry","clear one surface","set a 10-minute tidy timer","empty the dishwasher"]},
body:{name:"Exercise",c:"--body",why:"Keep the habit small enough that skipping it feels silly.",habits:["do 10 squats","stretch for five minutes","do 10 pushups (wall pushups are fine)","walk around the block","hold a plank for 30 seconds","do a short walk and pray"]},
word:{name:"Bible",c:"--word",why:"A short, steady time in the Word beats an ambitious plan that stops by week two.",habits:["read one chapter of my Bible","read one Psalm","read one chapter of Proverbs","read a short passage from a Gospel","write down one verse that stood out","pray for two minutes after reading"]},
hobby:{name:"Hobby",c:"--hobby",why:"Name something you want to get better at, then give it ten minutes.",habits:["practice an instrument for 10 minutes","sketch or paint for 10 minutes","write one paragraph","work on a craft project for 10 minutes","practice a language for 10 minutes","take one photo on purpose"]}
};
var ORDER=["home","body","word","hobby"];
var ANCHORS=["wake up","pour my morning coffee","brush my teeth","eat breakfast","get home from work","finish lunch","finish dinner","put the kids to bed","sit down on the couch in the evening","get into bed"];
var S={tab:"build",cat:"home",anchor:ANCHORS[1],ancc:"",habit:"",time:"",stacks:[],msg:"",nmsg:"",notify:false,meals:{breakfast:"",lunch:"",dinner:""}};
var KEY="habit-stacker-v1";
try{var raw=localStorage.getItem(KEY);if(raw){var p=JSON.parse(raw);if(p&&Array.isArray(p.stacks))S.stacks=p.stacks;if(p&&p.meals)S.meals=p.meals}}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify({stacks:S.stacks,meals:S.meals}))}catch(e){}}
function esc(t){return String(t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
function dk(d){var m=d.getMonth()+1,x=d.getDate();return d.getFullYear()+"-"+(m<10?"0":"")+m+"-"+(x<10?"0":"")+x}
function ago(n){var d=new Date();d.setDate(d.getDate()-n);return dk(d)}
function streak(s){var n=0,i=s.log[ago(0)]?0:1;while(s.log[ago(i)]){n++;i++}return n}
function sentence(a,h){return "After I "+a+", I will "+h+"."}
function curAnchor(){return S.anchor==="__c"?S.ancc.trim():S.anchor}
function render(){
document.getElementById("t-build").setAttribute("aria-selected",S.tab==="build");
document.getElementById("t-today").setAttribute("aria-selected",S.tab==="today");
document.getElementById("view").innerHTML=S.tab==="build"?buildView():todayView();
if(S.tab==="build")updatePrev();
}
function buildView(){
var cat=CATS[S.cat],h='<div style="--c:var('+cat.c+')">';
h+='<div class="seg" role="group" aria-label="Category">';
ORDER.forEach(function(k){h+='<button data-act="cat" data-v="'+k+'" aria-pressed="'+(S.cat===k)+'" style="--c:var('+CATS[k].c+')">'+CATS[k].name+'</button>'});
h+='</div><p class="why">'+esc(cat.why)+'</p>';
h+='<label for="anc">Step 1: Pick something you already do daily</label><select id="anc" data-act="anc">';
ANCHORS.forEach(function(a){h+='<option value="'+esc(a)+'"'+(S.anchor===a?" selected":"")+'>After I '+esc(a)+'</option>'});
h+='<option value="__c"'+(S.anchor==="__c"?" selected":"")+'>Something else…</option></select>';
if(S.anchor==="__c")h+='<input type="text" id="ancc" placeholder="e.g. park the car at home" value="'+esc(S.ancc)+'" style="margin-top:8px" aria-label="Your own routine">';
h+='<label>Step 2: Choose a tiny habit</label><div class="chips">';
cat.habits.forEach(function(x,i){h+='<button class="chip" data-act="pick" data-v="'+i+'" aria-pressed="'+(S.habit===x)+'">'+esc(x)+'</button>'});
h+='</div><input type="text" id="cus" placeholder="Or write your own, e.g. practice guitar for 10 minutes" value="'+esc(S.habit)+'" aria-label="Your own habit">';
h+='<label for="tm">Step 3: Reminder time (optional)</label><input type="time" id="tm" value="'+esc(S.time)+'">';
h+='<div class="prev empty" id="prev"></div><div class="msg" id="msg" role="status">'+esc(S.msg)+'</div>';
h+='<button class="add" data-act="add">Add to my plan</button>';
h+='<label style="margin-top:28px">Your meal times</label><p class="why" style="--c:var(--accent)">Stacks attached to breakfast, lunch, or dinner use these as their reminder time unless you set one.</p><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px">';
["breakfast","lunch","dinner"].forEach(function(m){h+='<div><div style="font-size:13px;color:var(--muted);margin-bottom:4px">'+m.charAt(0).toUpperCase()+m.slice(1)+'</div><input type="time" data-meal="'+m+'" value="'+esc(S.meals[m])+'" aria-label="'+m+' time"></div>'});
h+='</div></div>';
return h}
function updatePrev(){
var el=document.getElementById("prev");if(!el)return;
var a=curAnchor(),hb=S.habit.trim();
if(a&&hb){el.className="prev";el.textContent=sentence(a,hb)}
else{el.className="prev empty";el.textContent="Your stack will appear here once you pick a routine and a habit."}}
function todayView(){
if(!S.stacks.length)return '<div class="empty-state"><p>No stacks yet. Build your first one. Just one is enough to start.</p><button data-act="tab" data-v="build">Build a stack</button></div>';
var t=ago(0),done=S.stacks.filter(function(s){return s.log[t]}).length;
var h='<p class="prog">'+done+' of '+S.stacks.length+' done today</p><button class="chip" data-act="notify">'+(S.notify?"Reminders are on":"Turn on reminders")+'</button><div class="msg">'+esc(S.nmsg||"Reminders only fire while this page is open. For dependable alerts, also set a phone alarm.")+'</div>';
if(S.stacks.length>3)h+='<div class="note">You have more than three stacks. Habits tend to stick better when you add them one at a time, so consider pausing new ones until these feel automatic.</div>';
ORDER.forEach(function(k){
var list=S.stacks.filter(function(s){return s.cat===k}).sort(function(a,b){return (a.time||"99:99")<(b.time||"99:99")?-1:1});if(!list.length)return;
h+='<div class="group" style="--c:var('+CATS[k].c+')"><h2>'+CATS[k].name+'</h2>';
list.forEach(function(s){
var n=streak(s),dots="";
for(var i=6;i>=0;i--)dots+='<span class="dot'+(s.log[ago(i)]?" on":"")+'"></span>';
h+='<div class="row" style="--c:var('+CATS[k].c+')"><button class="chk" data-act="tog" data-id="'+s.id+'" aria-pressed="'+(!!s.log[t])+'" aria-label="Mark done today">'+(s.log[t]?"✓":"")+'</button><div class="rt"><p>'+(s.time?'<strong>'+fmt(s.time)+'</strong> ':'')+esc(sentence(s.anchor,s.habit))+'</p><div class="meta"><span>'+(n?n+(n===1?" day":" days")+" in a row":"Not started yet")+'</span><span class="dots" aria-label="Last 7 days">'+dots+'</span><button class="del" data-act="del" data-id="'+s.id+'">Remove</button></div></div></div>'});
h+='</div>'});
return h}
document.addEventListener("click",function(e){
var b=e.target.closest("[data-act]");if(!b||b.tagName==="SELECT")return;
var a=b.getAttribute("data-act"),v=b.getAttribute("data-v"),id=b.getAttribute("data-id");
if(a==="tab"){S.tab=v;S.msg="";render()}
else if(a==="cat"){S.cat=v;S.habit="";S.msg="";render()}
else if(a==="pick"){S.habit=CATS[S.cat].habits[+v];S.msg="";render()}
else if(a==="add"){
var an=curAnchor(),hb=S.habit.trim();
if(!an){S.msg="Choose or write the routine you will attach this to.";render();return}
if(!hb){S.msg="Choose or write a tiny habit.";render();return}
var MM={"eat breakfast":"breakfast","finish lunch":"lunch","finish dinner":"dinner"},tm=S.time||(MM[an]?S.meals[MM[an]]:"")||"";S.stacks.push({id:String(Date.now()),cat:S.cat,anchor:an,habit:hb,time:tm,log:{}});
save();S.habit="";S.time="";S.msg="";S.tab="today";render()}
else if(a==="tog"){
S.stacks.forEach(function(s){if(s.id===id){if(s.log[ago(0)])delete s.log[ago(0)];else s.log[ago(0)]=true}});
save();render()}
else if(a==="del"){S.stacks=S.stacks.filter(function(s){return s.id!==id});save();render()}
else if(a==="notify"){
if(!("Notification" in window)){S.nmsg="This browser doesn’t support page notifications. Use your phone’s alarms or calendar instead.";render();return}
try{Notification.requestPermission().then(function(r){S.notify=(r==="granted");S.nmsg=S.notify?"Reminders are on while this page stays open.":"Notifications were blocked. Allow them in your browser settings to use reminders.";render()})}catch(err){S.nmsg="Couldn’t turn on notifications here.";render()}}
});
document.addEventListener("change",function(e){
if(e.target.id==="anc"){S.anchor=e.target.value;render()}});
document.addEventListener("input",function(e){
if(e.target.id==="cus"){S.habit=e.target.value;updatePrev()}
else if(e.target.id==="ancc"){S.ancc=e.target.value;updatePrev()}
else if(e.target.id==="tm"){S.time=e.target.value}
else if(e.target.getAttribute("data-meal")){S.meals[e.target.getAttribute("data-meal")]=e.target.value;save()}});
function fmt(t){var p=t.split(":"),h=+p[0];return (h%12||12)+":"+p[1]+(h<12?" AM":" PM")}
var fired={};
setInterval(function(){
if(!S.notify||!("Notification" in window)||Notification.permission!=="granted")return;
var d=new Date(),hh=d.getHours(),mm=d.getMinutes(),now=(hh<10?"0":"")+hh+":"+(mm<10?"0":"")+mm,t=dk(d);
S.stacks.forEach(function(s){if(s.time===now&&!s.log[t]&&fired[s.id]!==t+now){fired[s.id]=t+now;try{new Notification("Habit Stacker",{body:sentence(s.anchor,s.habit)})}catch(e){}}})
},20000);
S.tab=S.stacks.length?"today":"build";
render();
if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})})}
</script>
</body>
</html>
